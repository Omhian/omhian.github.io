name: Pubblica il sito

# Ogni push su main ricompila e pubblica. Niente altro da fare a mano.
on:
  push:
    branches: [main]
  workflow_dispatch:        # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Se arrivano due push ravvicinati, lascia finire il primo e poi fa' il secondo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.0
    steps:
      - name: Installa Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Scarica il repo
        uses: actions/checkout@v4

      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compila
        env:
          HUGO_ENVIRONMENT: production
        # base_url viene da GitHub: e' il dominio tuo se l'hai gia'
        # impostato in Settings > Pages, altrimenti l'indirizzo
        # nome.github.io. Cosi' i link assoluti sono giusti in entrambi
        # i casi, senza toccare hugo.toml.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Carica il risultato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Metti online
        id: deployment
        uses: actions/deploy-pages@v4
