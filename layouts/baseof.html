<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ block "titolo" . }}{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.descrizione }}{{ end }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Lacquer&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}">{{ end }}
</head>
<body>

<header class="testata">
  <a class="marchio" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }}">
    <svg viewBox="-32 -150 1178 280" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>Heliophobia Press</title>
      <rect x="-20" y="-20" width="1096" height="128" fill="#0B0B0B"/>
      <g fill="#A3CC00">
        <rect x="0" y="0" width="22" height="88"/><rect x="66" y="0" width="22" height="88"/><rect x="0" y="33" width="88" height="22"/>
        <rect x="374" y="0" width="22" height="88"/><rect x="440" y="0" width="22" height="88"/><rect x="374" y="0" width="88" height="22"/><rect x="374" y="66" width="88" height="22"/>
        <rect x="484" y="0" width="22" height="88"/><rect x="484" y="0" width="88" height="22"/><rect x="550" y="0" width="22" height="55"/><rect x="484" y="33" width="88" height="22"/>
      </g>
      <g fill="#CCFF00">
        <rect x="110" y="0" width="22" height="88"/><rect x="110" y="0" width="88" height="22"/><rect x="110" y="33" width="66" height="22"/><rect x="110" y="66" width="88" height="22"/>
        <rect x="220" y="0" width="22" height="88"/><rect x="330" y="0" width="22" height="88"/>
      </g>
      <g fill="#7A9B00">
        <rect x="594" y="0" width="22" height="88"/><rect x="660" y="0" width="22" height="88"/><rect x="594" y="33" width="88" height="22"/>
        <rect x="704" y="0" width="22" height="88"/><rect x="770" y="0" width="22" height="88"/><rect x="704" y="0" width="88" height="22"/><rect x="704" y="66" width="88" height="22"/>
        <rect x="814" y="0" width="22" height="88"/><rect x="814" y="0" width="66" height="22"/><rect x="858" y="0" width="22" height="55"/><rect x="814" y="33" width="88" height="22"/><rect x="880" y="33" width="22" height="55"/><rect x="814" y="66" width="88" height="22"/>
        <rect x="924" y="0" width="22" height="88"/>
        <rect x="968" y="0" width="22" height="88"/><rect x="1034" y="0" width="22" height="88"/><rect x="968" y="0" width="88" height="22"/><rect x="968" y="33" width="88" height="22"/>
      </g>
      <rect x="220" y="66" width="88" height="22" fill="#FF4A1C"/>
      <text x="866" y="-8" text-anchor="middle" transform="rotate(-4 866 -64)"
            fill="#FF4A1C" stroke="#0B0B0B" stroke-width="12" paint-order="stroke fill"
            font-family="Lacquer, sans-serif" font-size="160">PRESS</text>
    </svg>
  </a>
</header>

<nav class="barra" aria-label="Navigazione principale">
  <ul>
    {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="attivo"{{ end }}>{{ .Name }}</a></li>
    {{ end }}
  </ul>
</nav>

<main class="foglio">
  {{ block "corpo" . }}{{ end }}
</main>

<footer class="piede">
  <p>&copy; {{ now.Year }} Heliophobia &mdash; Tutti i diritti riservati.</p>
</footer>

</body>
</html>
